<polyline points="740,600 1011,600 1011,316" fill="none" stroke="#b23a1e" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="660.0" y="591" width="80" height="18" fill="#fff" stroke="#b23a1e" stroke-width="1.8"/>
<text x="700" y="585" font-size="12.5" fill="#b23a1e" text-anchor="middle" font-weight="bold">Rf ≈ 3.9–4.7 kΩ  (NEW)</text>
<text x="700" y="634" font-size="12" fill="#b23a1e" text-anchor="middle" font-weight="bold">one resistor, two clips: one leg on each red grabber above</text>
<text x="700" y="652" font-size="12" fill="#b23a1e" text-anchor="middle">keep its leads as short as the bench allows; no other wire, no ground</text>
<rect x="40" y="690" width="1320" height="150" rx="10" fill="#fff" stroke="#8a8985" stroke-width="1.4"/>
<text x="56" y="716" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">How it works</text>
<text x="56" y="742" font-size="12" fill="#0b0b0b" text-anchor="start">When OUT+ goes high (+0.39 V relative to low), a small current flows through Rf into the IN+ point and lifts IN+ a little: the output holds itself high.</text>
<text x="56" y="764" font-size="12" fill="#0b0b0b" text-anchor="start">To switch back, IN+ must fall below the threshold by that extra lift. Hysteresis ≈ 0.39 V × Rs / (Rs + Rf), with Rs = 100 Ω + the CGR-201's own 50 Ω = 150 Ω.</text>
<text x="56" y="786" font-size="12" fill="#0b0b0b" text-anchor="start">Rf 5.6 kΩ → about 10 mV;  4.7 kΩ → about 12 mV;  3.9 kΩ → about 14 mV;  2 kΩ → about 27 mV.  Rs sets how far IN+ can be lifted.</text>
<text x="56" y="808" font-size="12" fill="#0b0b0b" text-anchor="start">Why not J2: J2 is the same node as J1, but reaching it needs another cable, which adds a long loop. The J1 red grabber is the same node and already exposed.</text>
<text x="1370" y="852" font-size="11" fill="#52514e" text-anchor="end">Draft, 23 Nov 2026</text>
</svg>
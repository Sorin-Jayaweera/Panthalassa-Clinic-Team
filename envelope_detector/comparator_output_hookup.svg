<text x="30" y="36" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="bold">Comparator outputs to the CGR-201, no soldering</text>
<text x="30" y="58" font-size="13" fill="#52514e" text-anchor="start">Resistor legs and wire ends are clamped under the screws. “+” is the cable's centre conductor, “−” is its shield (ground).</text>
<rect x="30" y="110" width="150" height="400" rx="8" fill="#f4f3ef" stroke="#8a8985" stroke-width="1.5"/>
<text x="105" y="300" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Comparator</text>
<text x="105" y="318" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">board</text>
<rect x="172" y="179" width="30" height="22" rx="3" fill="#d9b24a" stroke="#0b0b0b" stroke-width="1.3"/>
<text x="164" y="195" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold">J7  OUT+</text>
<rect x="172" y="419" width="30" height="22" rx="3" fill="#d9b24a" stroke="#0b0b0b" stroke-width="1.3"/>
<text x="164" y="435" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold">J8  OUT−</text>
<polyline points="202,190 384,190" fill="none" stroke="#0b0b0b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="202,190 384,190" fill="none" stroke="#777" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="202,430 384,430" fill="none" stroke="#0b0b0b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="202,430 384,430" fill="none" stroke="#777" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="293" y="172" font-size="12" fill="#52514e" text-anchor="middle">SMA-to-BNC cable</text>
<text x="293" y="456" font-size="12" fill="#52514e" text-anchor="middle">SMA-to-BNC cable</text>
<text x="293" y="310" font-size="12" fill="#52514e" text-anchor="middle">same type and</text>
<text x="293" y="326" font-size="12" fill="#52514e" text-anchor="middle">same length,</text>
<text x="293" y="342" font-size="12" fill="#52514e" text-anchor="middle">as short as you have</text>

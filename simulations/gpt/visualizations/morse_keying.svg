  <line class="axis" x1="70" y1="220" x2="70" y2="55"/>
  <polyline class="line1" points="70.00,55.00 127.14,55.00 127.14,220.00 184.29,220.00 184.29,55.00 355.71,55.00 355.71,220.00 412.86,220.00 412.86,55.00 470.00,55.00 470.00,220.00 870.00,220.00"/>
  <text x="470.0" y="262" text-anchor="middle">Time (s)</text>
  <text x="98.6" y="43" text-anchor="middle" font-size="24">.</text>
  <text x="270.0" y="43" text-anchor="middle" font-size="24">-</text>
  <text x="441.4" y="43" text-anchor="middle" font-size="24">.</text>


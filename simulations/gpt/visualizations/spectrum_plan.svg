<text x="411.8" y="335" text-anchor="middle">4</text>
<line class="grid" x1="502.4" y1="55" x2="502.4" y2="310"/>
<text x="502.4" y="335" text-anchor="middle">5</text>
<line class="grid" x1="592.9" y1="55" x2="592.9" y2="310"/>
<text x="592.9" y="335" text-anchor="middle">6</text>
<line class="grid" x1="683.4" y1="55" x2="683.4" y2="310"/>

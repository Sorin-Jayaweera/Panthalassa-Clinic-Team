<line class="grid" x1="864.5" y1="55" x2="864.5" y2="310"/>
<text x="864.5" y="335" text-anchor="middle">9</text>
<line class="grid" x1="955.0" y1="55" x2="955.0" y2="310"/>
<text x="955.0" y="335" text-anchor="middle">10</text>
<text x="20" y="85">RX radar</text>
<rect class="band_rx" x="891.6" y="64" width="18.1" height="32"/>
<text x="20" y="135">LO</text>
<line x1="801.1" y1="112" x2="801.1" y2="148" stroke="#333" stroke-width="5"/>

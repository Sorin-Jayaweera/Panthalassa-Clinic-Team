<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <style>
    text { font-family: Arial, sans-serif; fill: #111; }
    .axis { stroke: #222; stroke-width: 1.5; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .line1 { fill: none; stroke: #1769aa; stroke-width: 2.5; }
    .line2 { fill: none; stroke: #b35c00; stroke-width: 2.5; }
    .band_rx { fill: #1769aa; }
    .band_if { fill: #2e7d32; }
    .band_tx { fill: #b71c1c; }
    .band_image { fill: #8a6d3b; }
    .box { fill: #f7f7f4; stroke: #222; stroke-width: 2; rx: 6; }
    .rx { fill: #e8f2ff; }
    .if { fill: #eaf6ea; }
    .ctrl { fill: #fff4dd; }
    .tx { fill: #ffeaea; }
    .arrow { stroke: #222; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 7 7; }
    .small { font-size: 15px; }
    .title { font-size: 24px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#222"/>
    </marker>
  </defs>
<text class="title" x="95" y="38">JACON frequency plan</text>
<line class="grid" x1="140.3" y1="55" x2="140.3" y2="310"/>
<text x="140.3" y="335" text-anchor="middle">1</text>
